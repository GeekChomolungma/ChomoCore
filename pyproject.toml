[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chomocore"
version = "0.2.0"
description = "Modular quantitative trading infrastructure — unified pipeline for live trading and backtesting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "PyYAML>=6.0.1",
  "requests>=2.32",
  "pymongo>=4.6",
]

[tool.setuptools.packages.find]
include = ["core*", "pipeline*", "backtest*", "live*", "engine*", "infra*"]
