mode: backtest

mongo:
  uri: mongodb://localhost:27017
  db: market_info
  exchange: Binance

# Each entry declares one (symbol, timeframe) slot with its own indicator chain.
# Exactly one entry must be marked primary: true — the signal is attributed to it.
contexts:
  - symbol: BTCUSDT
    timeframe: 1h
    primary: true
    indicators:
      - name: rsi
        params:
          length: 14
      - name: volatility_band
        params:
          length: 20
          mult: 2.0
          atr_mult: 1.5
  - symbol: BTCUSDT
    timeframe: 4h
    indicators:
      - name: super_trend
        params:
          length: 10
          factor: 5.0

strategy:
  name: ma_cross
  params:
    fast_window: 12
    slow_window: 48
    max_position: 1.0

data:
  start: 2024-01-01
  end:

backtest:
  warmup_bars: 60
