mode: backtest
symbol: BTCUSDT
timeframe: 1h

# MongoDB connection (remove this section to fall back to synthetic data)
mongo:
  uri: mongodb://localhost:27017
  db: market_info
  exchange: Binance

data:
  start: 2024-01-01   # optional, passed to KlineRepository.load_bars
  end:                 # optional, leave blank for all data up to now
  # periods / seed are only used when mongo section is absent (synthetic fallback)
  periods: 400
  seed: 7

indicators:
  - name: rsi
    params:
      length: 14
  - name: super_trend
    params:
      length: 10
      factor: 5.0
  - name: volatility_band
    params:
      length: 20
      mult: 2.0
      atr_mult: 1.5

strategy:
  name: ma_cross
  params:
    fast_window: 12
    slow_window: 48
    max_position: 1.0

backtest:
  warmup_bars: 60
