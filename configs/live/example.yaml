mode: live
symbol: BTCUSDT
timeframe: 1m

data:
  # Source will be Redis (live) or Mongo (historical window for warmup).
  # Until the real adapter is wired, synthetic data is used as a stand-in.
  start: 2024-01-01
  periods: 200
  seed: 7

indicators:
  - name: rsi
    params:
      length: 14
  - name: super_trend
    params:
      length: 10
      factor: 5.0

strategy:
  name: rsi
  params:
    window: 14
    oversold: 35
    overbought: 65
    max_position: 0.5

execution:
  endpoint: http://localhost:8080/signal
  timeout: 3.0
  dry_run: true
