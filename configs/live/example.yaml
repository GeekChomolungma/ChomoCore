mode: live

mongo:
  uri: mongodb://localhost:27017
  db: market_info
  exchange: Binance

contexts:
  - symbol: BTCUSDT
    timeframe: 1m
    primary: true
    indicators:
      - name: rsi
        params:
          length: 14
      - name: super_trend
        params:
          length: 10
          factor: 5.0

strategy:
  name: rsi
  params:
    window: 14
    oversold: 35
    overbought: 65
    max_position: 0.5

data:
  # Bars loaded per context for indicator warmup.
  # Must be >= max(indicator lookback) + safety margin.
  window_size: 200

execution:
  endpoint: http://localhost:8080/signal
  timeout: 3.0
  dry_run: true
